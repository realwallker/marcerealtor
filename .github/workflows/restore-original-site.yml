name: Restore marcerealtor after temporary Karina page

on:
  schedule:
    - cron: "15 5 19 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-original-site:
    if: github.repository == 'realwallker/marcerealtor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the temporary site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore the original marcerealtor files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/marcerealtor-before-karina-2026-08-16
          git rm -r --ignore-unmatch .
          git clean -fdx
          git checkout FETCH_HEAD -- .
          git add -A

          if git diff --cached --quiet; then
            echo "The original site is already restored."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore marcerealtor after temporary Karina page"
          git push origin HEAD:main
